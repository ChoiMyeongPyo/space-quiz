<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우주 탐험 퀴즈</title>
  <style>
    :root {
      --bg-1: #0b1026;
      --bg-2: #1b1f4b;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.18);
      --text: #f5f7ff;
      --muted: #c3c8ee;
      --accent: #7c5cff;
      --accent-2: #2ec5ff;
      --correct: #1fbf75;
      --correct-bg: #0f5132;
      --incorrect: #ff5c7a;
      --incorrect-bg: #6b1426;
      --focus: #ffd447;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 92, 255, 0.35), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(46, 197, 255, 0.25), transparent 45%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 10% 20%, #fff, transparent),
        radial-gradient(1px 1px at 30% 80%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 50% 40%, #fff, transparent),
        radial-gradient(1px 1px at 70% 10%, #fff, transparent),
        radial-gradient(2px 2px at 85% 55%, #fff, transparent),
        radial-gradient(1px 1px at 60% 90%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 20% 60%, #fff, transparent);
      opacity: 0.6;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.35; }
      to { opacity: 0.8; }
    }

    main {
      position: relative;
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.75rem;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle { margin: 0 0 20px; color: var(--muted); }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .score { color: var(--text); }

    .progress {
      height: 12px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      border-radius: inherit;
      transition: width 0.4s ease;
    }

    .question {
      font-size: 1.3rem;
      margin: 0 0 18px;
    }

    .answers {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      font: inherit;
      font-size: 1.05rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition:
        background-color 0.4s ease,
        border-color 0.4s ease,
        box-shadow 0.15s ease,
        transform 0.1s ease;
    }

    .answer-btn:hover:not(:disabled) {
      background: rgba(124, 92, 255, 0.25);
      border-color: var(--accent);
    }

    .answer-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.99);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .answer-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      box-shadow: 0 0 0 6px rgba(255, 212, 71, 0.3);
    }

    .primary-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .answer-btn:disabled { cursor: default; }

    .answer-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      animation: pop 0.45s ease;
    }

    .answer-btn.incorrect {
      background: var(--incorrect-bg);
      border-color: var(--incorrect);
      animation: shake 0.45s ease;
    }

    .answer-btn.correct::after { content: "  ✓ 정답"; font-weight: 700; }
    .answer-btn.incorrect::after { content: "  ✗ 오답"; font-weight: 700; }

    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .feedback {
      min-height: 1.5em;
      margin: 18px 0 0;
      font-weight: 600;
    }

    .feedback.is-correct { color: var(--correct); }
    .feedback.is-incorrect { color: var(--incorrect); }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .primary-btn {
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124, 92, 255, 0.4); }

    [hidden] { display: none !important; }

    .results { text-align: center; }

    .results .big-score {
      font-size: 3rem;
      font-weight: 800;
      margin: 12px 0;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .results .rocket {
      font-size: 3rem;
      display: inline-block;
      animation: launch 1.2s ease-out;
    }

    @keyframes launch {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .review { text-align: left; margin-top: 24px; }

    .best-score { margin: 0 0 8px; font-weight: 600; color: var(--muted); }
    .best-score.is-new { color: var(--focus); }

    .review h3 { margin: 0 0 12px; }

    .review-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .review-item {
      padding: 12px 16px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.06);
      border-left: 6px solid var(--card-border);
    }

    .review-item.is-correct { border-left-color: var(--correct); }
    .review-item.is-incorrect { border-left-color: var(--incorrect); }

    .review-question { margin: 0 0 4px; font-weight: 600; }
    .review-answer { margin: 0; color: var(--muted); }
    .review-mark { font-weight: 700; color: var(--text); }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main>
    <h1>🚀 우주 탐험 퀴즈</h1>
    <p class="subtitle">우주에 대한 지식을 테스트해 보세요 — 총 10문제.</p>

    <section id="quiz" aria-labelledby="question-text">
      <div class="status">
        <span id="question-count">10문제 중 1번</span>
        <span class="score">점수: <span id="score">0</span></span>
      </div>
      <div
        class="progress"
        role="progressbar"
        aria-label="퀴즈 진행률"
        aria-valuemin="0"
        aria-valuemax="10"
        aria-valuenow="0"
        id="progress"
      >
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <h2 class="question" id="question-text" tabindex="-1"></h2>
      <ul class="answers" id="answers"></ul>

      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

      <div class="actions">
        <button type="button" class="primary-btn" id="next-btn" hidden>다음 문제</button>
      </div>
    </section>

    <section id="results" class="results" hidden aria-labelledby="results-title">
      <div class="rocket" aria-hidden="true">🪐</div>
      <h2 id="results-title" tabindex="-1" aria-describedby="final-score best-score">임무 완료!</h2>
      <p class="big-score" id="final-score"></p>
      <p class="best-score" id="best-score"></p>
      <p id="result-message"></p>
      <div class="review">
        <h3 id="review-title">답안 검토</h3>
        <ol class="review-list" id="review-list" aria-labelledby="review-title"></ol>
      </div>
      <div class="actions" style="justify-content: center;">
        <button type="button" class="primary-btn" id="restart-btn">다시 하기</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        q: "'붉은 행성'으로 알려진 행성은 무엇일까요?",
        options: ["금성", "화성", "목성", "수성"],
        answer: 1,
      },
      {
        q: "달 위를 처음으로 걸은 사람은 누구일까요?",
        options: ["버즈 올드린", "유리 가가린", "닐 암스트롱", "마이클 콜린스"],
        answer: 2,
      },
      {
        q: "태양계에서 가장 큰 행성은 무엇일까요?",
        options: ["토성", "해왕성", "지구", "목성"],
        answer: 3,
      },
      {
        q: "우주로 발사된 최초의 인공위성 이름은 무엇일까요?",
        options: ["스푸트니크 1호", "익스플로러 1호", "보스토크 1호", "아폴로 1호"],
        answer: 0,
      },
      {
        q: "2021년에 발사되어 주로 적외선으로 관측하는 우주 망원경은 무엇일까요?",
        options: ["허블", "케플러", "제임스 웹", "스피처"],
        answer: 2,
      },
      {
        q: "우리 태양계가 속한 은하는 무엇일까요?",
        options: ["안드로메다 은하", "우리은하", "삼각형자리 은하", "소용돌이 은하"],
        answer: 1,
      },
      {
        q: "가장 뚜렷한 고리를 가진 행성은 무엇일까요?",
        options: ["천왕성", "토성", "해왕성", "화성"],
        answer: 1,
      },
      {
        q: "햇빛이 지구에 도달하는 데 걸리는 시간은 대략 얼마일까요?",
        options: ["8초", "8분", "8시간", "8일"],
        answer: 1,
      },
      {
        q: "2021년 2월 화성에 착륙한 탐사 로버는 무엇일까요?",
        options: ["큐리오시티", "스피릿", "오퍼튜니티", "퍼서비어런스"],
        answer: 3,
      },
      {
        q: "블랙홀 주변에서 그 안으로 들어가면 아무것도 빠져나올 수 없는 경계를 무엇이라고 할까요?",
        options: ["사건의 지평선", "광자구", "특이점", "강착 원반"],
        answer: 0,
      },
    ];

    const els = {
      quiz: document.getElementById("quiz"),
      results: document.getElementById("results"),
      count: document.getElementById("question-count"),
      score: document.getElementById("score"),
      progress: document.getElementById("progress"),
      progressFill: document.getElementById("progress-fill"),
      question: document.getElementById("question-text"),
      answers: document.getElementById("answers"),
      feedback: document.getElementById("feedback"),
      next: document.getElementById("next-btn"),
      finalScore: document.getElementById("final-score"),
      bestScore: document.getElementById("best-score"),
      resultMessage: document.getElementById("result-message"),
      resultsTitle: document.getElementById("results-title"),
      restart: document.getElementById("restart-btn"),
      reviewList: document.getElementById("review-list"),
    };

    let current = 0;
    let score = 0;
    let chosen = [];

    const BEST_SCORE_KEY = "space-quiz-best-score";

    // 개인정보 보호 모드 등에서는 localStorage 접근 자체가 예외를 던질 수 있습니다.
    function loadBestScore() {
      try {
        return Number(localStorage.getItem(BEST_SCORE_KEY)) || 0;
      } catch {
        return 0;
      }
    }

    function saveBestScore(value) {
      try {
        localStorage.setItem(BEST_SCORE_KEY, String(value));
      } catch {
        // 저장할 수 없어도 퀴즈는 계속 동작합니다.
      }
    }

    function renderBestScore() {
      const previousBest = loadBestScore();
      const isNewRecord = score > previousBest;
      const best = isNewRecord ? score : previousBest;

      els.bestScore.textContent = `최고 점수: ${best} / ${questions.length}`;
      els.bestScore.classList.toggle("is-new", isNewRecord);
      if (!isNewRecord) return;

      saveBestScore(score);
      els.bestScore.textContent += " — 🎉 새 최고 기록!";
    }

    function updateProgress(answeredCount) {
      const pct = (answeredCount / questions.length) * 100;
      els.progressFill.style.width = pct + "%";
      els.progress.setAttribute("aria-valuenow", String(answeredCount));
    }

    function renderQuestion() {
      const item = questions[current];
      els.count.textContent = `${questions.length}문제 중 ${current + 1}번`;
      els.question.textContent = item.q;
      els.feedback.textContent = "";
      els.feedback.className = "feedback";
      els.next.hidden = true;
      els.answers.replaceChildren();

      item.options.forEach((text, i) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "answer-btn";
        btn.textContent = text;
        btn.addEventListener("click", () => selectAnswer(i, btn));
        li.appendChild(btn);
        els.answers.appendChild(li);
      });

      updateProgress(current);
      els.question.focus();
    }

    function selectAnswer(index, btn) {
      const item = questions[current];
      const buttons = els.answers.querySelectorAll(".answer-btn");
      buttons.forEach((b) => (b.disabled = true));
      chosen[current] = index;

      if (index === item.answer) {
        score++;
        els.score.textContent = String(score);
        btn.classList.add("correct");
        els.feedback.textContent = "정답입니다! 훌륭해요, 우주비행사님.";
        els.feedback.classList.add("is-correct");
      } else {
        btn.classList.add("incorrect");
        buttons[item.answer].classList.add("correct");
        els.feedback.textContent = `오답입니다. 정답은 '${item.options[item.answer]}'입니다.`;
        els.feedback.classList.add("is-incorrect");
      }

      updateProgress(current + 1);
      els.next.textContent = current === questions.length - 1 ? "결과 보기" : "다음 문제";
      els.next.hidden = false;
      els.next.focus();
    }

    function showResults() {
      els.quiz.hidden = true;
      els.results.hidden = false;
      els.finalScore.textContent = `${score} / ${questions.length}`;

      const ratio = score / questions.length;
      let message;
      if (ratio === 1) message = "만점입니다! 관제 센터에 바로 합류해도 되겠어요.";
      else if (ratio >= 0.7) message = "훌륭해요! 우주에 대해 잘 알고 계시네요.";
      else if (ratio >= 0.4) message = "좋은 시도예요! 궤도를 몇 바퀴 더 돌면 전문가가 될 거예요.";
      else message = "모든 우주비행사도 처음은 있었어요 — 다시 도전해 보세요!";
      els.resultMessage.textContent = message;
      renderBestScore();
      renderReview();
      els.resultsTitle.focus();
    }

    function createReviewItem(item, chosenIndex, number) {
      const isCorrect = chosenIndex === item.answer;
      const li = document.createElement("li");
      li.className = isCorrect ? "review-item is-correct" : "review-item is-incorrect";

      const question = document.createElement("p");
      question.className = "review-question";
      question.textContent = `${number}. ${item.q}`;

      const answer = document.createElement("p");
      answer.className = "review-answer";
      answer.textContent = `내 답: ${item.options[chosenIndex]} — `;

      const mark = document.createElement("span");
      mark.className = "review-mark";
      mark.textContent = isCorrect ? "✓ 정답" : "✗ 오답";
      answer.appendChild(mark);

      li.append(question, answer);
      if (isCorrect) return li;

      const correct = document.createElement("p");
      correct.className = "review-answer";
      correct.textContent = `정답: ${item.options[item.answer]}`;
      li.appendChild(correct);
      return li;
    }

    function renderReview() {
      const items = questions.map((item, i) => createReviewItem(item, chosen[i], i + 1));
      els.reviewList.replaceChildren(...items);
    }

    els.next.addEventListener("click", () => {
      current++;
      if (current < questions.length) renderQuestion();
      else showResults();
    });

    els.restart.addEventListener("click", () => {
      current = 0;
      score = 0;
      chosen = [];
      els.reviewList.replaceChildren();
      els.score.textContent = "0";
      els.results.hidden = true;
      els.quiz.hidden = false;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
